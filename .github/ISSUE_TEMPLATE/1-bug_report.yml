name: Bug report
description: Something isn't working as expected, or the game crashed.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you give, the faster it can be fixed.

  - type: dropdown
    id: mod
    attributes:
      label: Mod
      description: Which mod is this about?
      options:
        - LavaConduit
        - MuddyWaters
    validations:
      required: true

  - type: checkboxes
    id: prechecks
    attributes:
      label: Before you submit
      options:
        - label: I have searched the existing issues and this hasn't been reported yet.
          required: true
        - label: I am using the latest version of the mod for my Minecraft version.
          required: false

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: e.g. 1.0.2
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      placeholder: e.g. 26.3
    validations:
      required: true

  - type: input
    id: loader-version
    attributes:
      label: Fabric Loader version
      placeholder: e.g. 0.17.2
    validations:
      required: false

  - type: input
    id: fabric-api-version
    attributes:
      label: Fabric API version
      description: Leave blank if you're not using Fabric API.
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Dedicated server
        - LAN / Open to LAN
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a new world
        2. Place ...
        3. Wait ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / crash report
      description: |
        Paste the relevant part of `logs/latest.log` or the crash report. For large logs, upload to https://mclo.gs and paste the link instead.
      render: shell
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Other mods / modpack
      description: List other mods installed, or the modpack name and version.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / videos
      description: Drag and drop images or videos here if they help explain the problem.
    validations:
      required: false
