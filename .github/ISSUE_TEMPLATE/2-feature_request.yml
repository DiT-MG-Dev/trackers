name: Feature request
description: Suggest a new feature or an improvement to an existing one.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      description: Which mod is this about?
      options:
        - LavaConduit
        - MuddyWaters
    validations:
      required: true

  - type: checkboxes
    id: prechecks
    attributes:
      label: Before you submit
      options:
        - label: I have searched the existing issues and this hasn't been suggested yet.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and why the mod doesn't currently support it.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or mods you've tried.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, or anything else that helps.
    validations:
      required: false
